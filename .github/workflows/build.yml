name: Build Talos

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the built version'
        required: true

jobs:
  build:
    name: Build Talos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      USERNAME: ${{ github.repository_owner }}/talos
      PLATFORM: linux/amd64
      INSTALLER_ARCH: amd64
      PUSH: "true"
      # Used by the imager-based targets (installer, iso, image-metal) below.
      IMAGER_ARGS: --platform=metal --extra-kernel-arg=talos.platform=metal --system-extension-image=ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:eff58d8ba793011df676dc6ec245ac21dad1db442d7427243beb33b7ae0984e6

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        id: setup
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name || '' }}
        run: |
          if [[ "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Use a provided semver tag as-is
            VERSION="$INPUT_TAG"
          else
            # Use the talos version and append a pre-release identifier
            TALOS_TAG="$(git -C talos describe --tags --abbrev=0 || true)"
            if [ -z "$TALOS_TAG" ]; then
              echo "::error::Failed to determine the Talos version tag from the talos submodule (git describe --tags --abbrev=0 failed)"
              exit 1
            fi
            VERSION="${TALOS_TAG}-${INPUT_TAG}"
          fi

          echo "TAG=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_KERNEL=ghcr.io/$GITHUB_REPOSITORY_OWNER/talos/kernel:$VERSION" >> "$GITHUB_ENV"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        #with:
        #  buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Kernel Patch
        working-directory: ./pkgs
        run: >
          sed -i '/^\s*LLVM: 1/d' kernel/build/pkg.yaml

      - name: Build Kernel
        working-directory: ./pkgs
        env:
          CI_ARGS: >-
            --cache-from=type=registry,ref=ghcr.io/wittenbude/talos/cache:kernel
            --cache-to=type=registry,ref=ghcr.io/wittenbude/talos/cache:kernel,mode=max,compression=zstd
        run: make kernel

      # Each target below is a separate `docker buildx build`, so it gets its own cache ref.
      - name: Build Talos Kernel
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-kernel
            --cache-to=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-kernel,mode=max,compression=zstd
        run: make kernel

      - name: Build Talos initramfs
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-initramfs
            --cache-to=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-initramfs,mode=max,compression=zstd
        run: make initramfs

      - name: Build Talos imager
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-imager
            --cache-to=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-imager,mode=max,compression=zstd
        run: make imager

      - name: Build Talos installer-base
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-installer-base
            --cache-to=type=registry,ref=ghcr.io/wittenbude/talos/cache:talos-installer-base,mode=max,compression=zstd
        run: make installer-base

      - parallel:
          - name: Generate Installer Image
            working-directory: ./talos
            run: make installer

          - name: Generate ISO Image
            working-directory: ./talos
            run: make iso

          - name: Generate Metal Image
            working-directory: ./talos
            run: make image-metal

      - name: Upload ISO Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-${{ steps.setup.outputs.tag }}
          path: ./talos/_out/metal-amd64.iso
          archive: false

      - name: Upload Raw Image Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-${{ steps.setup.outputs.tag }}
          path: ./talos/_out/metal-amd64.raw.zst
          archive: false

      - name: Upload release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" $(find ./talos/_out -maxdepth 1 -type f) --repo "$GITHUB_REPOSITORY" --clobber
