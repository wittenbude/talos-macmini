name: Build Talos

on:
  push:
    branches: [main]
    tags: ['*']
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the built version'
        required: true

jobs:
  build:
    name: Build Talos
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    env:
      USERNAME: ${{ github.repository_owner }}/talos
      PLATFORM: linux/amd64
      INSTALLER_ARCH: amd64
      PUSH: "true"

    steps:
      - name: Setup GitHub Cache
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        id: setup
        env:
          INPUT_TAG: ${{ inputs.tag || github.ref_name || '' }}
        run: |
          if [[ "${INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            # Use a provided semver tag as-is
            VERSION="$INPUT_TAG"
          else
            # Use the talos version and append a pre-release identifier
            TALOS_TAG="$(git -C talos describe --tags --abbrev=0 || true)"
            if [ -z "$TALOS_TAG" ]; then
              echo "::error::Failed to determine the Talos version tag from the talos submodule (git describe --tags --abbrev=0 failed)"
              exit 1
            fi
            VERSION="${TALOS_TAG}-${INPUT_TAG}"
          fi

          echo "TAG=$VERSION" >> "$GITHUB_ENV"
          echo "PKG_KERNEL=ghcr.io/$GITHUB_REPOSITORY_OWNER/talos/kernel:$VERSION" >> "$GITHUB_ENV"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup crane
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        #with:
        #  buildkitd-flags: --allow-insecure-entitlement security.insecure

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply Kernel Patch
        working-directory: ./pkgs
        run: >
          sed -i '/^\s*LLVM: 1/d' kernel/build/pkg.yaml

      - name: Build Kernel
        working-directory: ./pkgs
        env:
          CI_ARGS: >-
            --cache-from=type=gha,scope=pkgs
            --cache-to=type=gha,mode=max,scope=pkgs
        run: make kernel

      # Each target below is a separate `docker buildx build`, so it gets its own cache scope.
      - name: Build Talos Kernel
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=gha,scope=talos-kernel
            --cache-to=type=gha,mode=max,scope=talos-kernel
        run: make kernel

      - name: Build Talos initramfs
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=gha,scope=talos-initramfs
            --cache-to=type=gha,mode=max,scope=talos-initramfs
        run: make initramfs

      - name: Build Talos imager
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=gha,scope=talos-imager
            --cache-to=type=gha,mode=max,scope=talos-imager
        run: make imager

      - name: Build Talos installer-base
        working-directory: ./talos
        env:
          CI_ARGS: >-
            --cache-from=type=gha,scope=talos-installer-base
            --cache-to=type=gha,mode=max,scope=talos-installer-base
        run: make installer-base

      - name: Generate Images
        working-directory: ./talos
        env:
          IMAGER_ARGS: --platform=metal --extra-kernel-arg=talos.platform=metal --system-extension-image=ghcr.io/siderolabs/iscsi-tools:v0.2.0@sha256:eff58d8ba793011df676dc6ec245ac21dad1db442d7427243beb33b7ae0984e6
        run: make installer iso image-metal

      - run: ls -alh ./talos/_out/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: talos-${{ steps.setup.outputs.tag }}
          path: ./talos/_out/*
          archive: false

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: ./talos/_out/*
